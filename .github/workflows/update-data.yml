name: Update market data

on:
  schedule:
    # Daily at 22:17 UTC, after most US data releases and the market close
    - cron: "17 22 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab (the app also starts it after watchlist edits)
    inputs:
      watchlist_only:
        description: "Only rescore watchlist.txt (fast; skips IPOs and the Discover scan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Score companies and recent IPOs
        # A failure here shouldn't stop the market signals from updating.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_companies.py ${{ inputs.watchlist_only && '--watchlist-only' || '' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market data $(date -u +%Y-%m-%d)"
            # The watchlist may have been edited from the app while this ran.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
