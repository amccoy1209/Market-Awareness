name: Update market data

on:
  schedule:
    # Daily at 22:17 UTC, after most US data releases and the market close
    - cron: "17 22 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab (the app also starts it after watchlist edits)
    inputs:
      watchlist_only:
        description: "Only rescore watchlist.txt (fast; skips IPOs and the Discover scan)"
        type: boolean
        default: false

permissions:
  contents: write

# Runs queue instead of overlapping. GitHub keeps only the newest waiting run, which is fine: every run reads the
# latest watchlist and rebuilds all the data.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the latest commit when the run begins, not the one current when it was queued.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Score companies and recent IPOs
        # A failure here shouldn't stop the market signals from updating.
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_companies.py ${{ inputs.watchlist_only && '--watchlist-only' || '' }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The data files are rebuilt from scratch each run, so a line-by-line rebase can only conflict. Instead,
          # put this run's files on top of the latest branch (which may have new watchlist edits) and push,
          # retrying if something else is pushed in between.
          saved="$RUNNER_TEMP/data"
          mkdir -p "$saved" && cp docs/*.json "$saved/"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$saved"/*.json docs/
            git add docs/*.json
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "Update market data $(date -u +%Y-%m-%d)"
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt was rejected; retrying on the latest $GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done
          echo "Could not push the updated data after 3 attempts" >&2
          exit 1
